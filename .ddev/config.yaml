name: website-base-scss
type: php
docroot: ""
php_version: "8.5"
webserver_type: apache-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "11.8"
hooks:
  post-start:
    - exec: if [ ! -d /var/www/html/node_modules ]; then npm ci; fi
omit_containers: [ db ]
use_dns_when_possible: true
composer_version: "2"
web_environment: []
nodejs_version: "24"
corepack_enable: false
